name: Daily GitHub Traffic Sync

on:
  schedule:
    # Runs daily at 01:00 UTC (06:30 AM IST) right after the UTC day finalizes
    - cron: "0 1 * * *"
  workflow_dispatch: # Allows manual "Run workflow" testing anytime

permissions:
  contents: write

jobs:
  sync-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily traffic sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python sync_daily.py

      - name: Commit and push updated traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/traffic_history.csv
          git diff --staged --quiet || git commit -m "chore: update daily traffic history"
          git push
